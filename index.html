<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红树林蓝碳秘密：地下碳宝库</title>
<style>
  :root{
    --paper:#f6f1e5; --ink:#17302a; --deep:#0d2420; --muted:#64786f;
    --green:#2f7d5c; --green-2:#57b573; --amber:#ffb03a; --coral:#c14e38;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--deep); color:var(--ink); overflow:hidden;
  }
  header{
    height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:#0a1c18;color:#e9e2cf;border-bottom:1px solid rgba(255,255,255,.08);
  }
  header h1{font-family:var(--serif);font-size:18px;letter-spacing:.08em;font-weight:600}
  header h1 em{font-style:normal;color:var(--amber)}
  #eggCount{margin-left:auto;font-size:13px;color:#ffd98a;background:rgba(255,176,58,.14);
    border:1px solid rgba(255,176,58,.35);padding:4px 12px;border-radius:99px;letter-spacing:.05em}
  .app{display:grid;grid-template-columns:1fr 396px;height:calc(100vh - 56px)}

  /* ---------- 舞台 ---------- */
  .stagewrap{position:relative;overflow:hidden;background:#0d2420}
  .stagewrap svg{width:100%;height:100%;display:block}
  .stagewrap.shake svg{animation:shk .45s linear 3}
  @keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
  #fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #fx.red{background:radial-gradient(circle at 50% 70%, transparent 30%, rgba(193,60,30,.55));opacity:1}
  #fx.glow{background:radial-gradient(circle at 60% 75%, rgba(255,176,58,.14), transparent 60%);opacity:1}

  .callout{
    position:absolute;left:16px;top:14px;max-width:420px;z-index:5;
    background:rgba(10,28,24,.86);color:#f3ecd8;border:1px solid rgba(255,176,58,.4);
    border-radius:14px;padding:12px 16px;font-size:14.5px;line-height:1.75;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.8);backdrop-filter:blur(4px);
    transition:opacity .5s,transform .5s;
  }
  .callout b{color:var(--amber)}
  .callout.hide{opacity:0;transform:translateY(-8px)}
  .callout .big{font-family:var(--serif);font-size:22px;color:var(--amber);letter-spacing:.04em}

  /* ---------- 粒子（锚点：纯色圆点 + 同色半透明外圈，无辉光滤镜） ---------- */
  .cpart .core{fill:var(--amber)}
  .cpart .halo{fill:var(--amber);opacity:.22}
  .cpart circle{transition:transform 1.6s cubic-bezier(.35,.65,.3,1),opacity 1.6s ease,fill .9s}
  .cpart.co2 .core{fill:#93a29d} .cpart.co2 .halo{fill:#93a29d;opacity:.16}
  .cpart.dim .core{fill:#a8853f} .cpart.dim .halo{fill:#a8853f;opacity:.16}
  .o2p{fill:#7fc7de;filter:drop-shadow(0 0 4px rgba(127,199,222,.8));transition:transform 1.4s cubic-bezier(.4,.5,.4,1),opacity 1.4s}
  .hotspot{cursor:pointer}
  .hot-c{fill:rgba(255,176,58,.28);stroke:rgba(255,214,130,.85);stroke-width:1.5;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{r:23;opacity:.7}50%{r:28;opacity:1}}
  .hicon path,.hicon circle,.hicon line,.hicon rect{stroke:#17302a;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .hicon .fill{fill:#17302a;stroke:none}
  .dicon path,.dicon circle,.dicon line,.dicon rect{stroke:#17302a;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dicon .fill{fill:#17302a;stroke:none}
  .microbe path{stroke:#cbbd97;stroke-width:2.4;fill:none;stroke-linecap:round;animation:wig 2.6s ease-in-out infinite}
  .microbe.awake path{stroke:#ff8563;animation:wig .28s linear infinite}
  @keyframes wig{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
  .o2dot{animation:wig 1.8s ease-in-out infinite}

  /* ---------- 面板 ---------- */
  .panel{background:var(--paper);padding:16px 18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .tabs{display:flex;gap:8px}
  .tab{flex:1;font-family:inherit;font-size:13.5px;padding:9px 4px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(23,48,42,.22);background:#fff;color:var(--muted);letter-spacing:.03em;
    transition:all .25s}
  .tab.on{background:var(--deep);color:#ffe9bd;border-color:var(--deep);font-weight:600}
  .narr{font-size:15px;line-height:1.95;min-height:5.2em;color:var(--ink);animation:fadein .6s}
  .narr b{color:var(--green)}
  .narr .hl{color:var(--coral);font-weight:600}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .steps{display:flex;gap:7px;flex-wrap:wrap}
  .steps button{flex:1;min-width:62px;font-family:inherit;font-size:13px;padding:9px 2px;border-radius:11px;
    border:1px solid rgba(23,48,42,.22);background:#fff;cursor:pointer;color:var(--ink);transition:all .25s}
  .steps button:hover{border-color:var(--green);color:var(--green)}
  .steps button.done{background:#eaf3ec;color:var(--green);border-color:#bcd9c6}
  .steps button.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
  .btn-primary{width:100%;font-family:inherit;font-size:15.5px;font-weight:600;letter-spacing:.05em;
    padding:13px;border-radius:14px;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#2f7d5c,#266449);box-shadow:0 14px 24px -14px rgba(31,90,66,.9);
    transition:transform .2s}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-ghost{font-family:inherit;font-size:14px;padding:11px;border-radius:13px;cursor:pointer;width:100%;
    background:#fff;border:1px solid rgba(23,48,42,.25);color:var(--ink)}
  .fate-choices{display:grid;gap:10px}
  .fchoice{display:flex;align-items:center;gap:12px;font-family:inherit;text-align:left;cursor:pointer;
    padding:14px 16px;border-radius:15px;font-size:16px;font-weight:600;letter-spacing:.04em;
    transition:transform .2s,box-shadow .2s}
  .fchoice:hover{transform:translateY(-2px)}
  .fchoice small{display:block;font-weight:400;font-size:12.5px;margin-top:3px;letter-spacing:0}
  .fchoice .emo{font-size:28px;line-height:1;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
  .result .tit .emo{font-size:26px;margin-right:7px}
  .fchoice.danger{background:linear-gradient(180deg,#fdf1ec,#f8e0d6);border:1.5px solid rgba(193,78,56,.5);color:#8c3520}
  .fchoice.safe{background:linear-gradient(180deg,#eff7ef,#dfeede);border:1.5px solid rgba(47,125,92,.5);color:#1d5c40}
  .fchoice.mid{background:linear-gradient(180deg,#fbf3dd,#f4ead0);border:1.5px solid rgba(214,158,58,.55);color:#8a6114}
  .fchoice.plan .ptag{align-self:stretch;display:flex;align-items:center;flex:none;
    font-size:12.5px;font-weight:600;letter-spacing:.2em;writing-mode:vertical-rl;opacity:.85}
  .fchoice.plan .pbody{display:block;flex:1}
  .fchoice.plan{font-size:17px;padding:13px 15px}
  .result{border-radius:15px;padding:15px 17px;font-size:14.5px;line-height:1.9;animation:fadein .6s}
  .result.bad{background:#fbeae4;border:1px solid rgba(193,78,56,.4)}
  .result.good{background:#eaf4ec;border:1px solid rgba(47,125,92,.4)}
  .result p{margin-bottom:7px}
  .result .tit{font-family:var(--serif);font-size:19px;margin-bottom:9px;letter-spacing:.06em}
  .result.bad .tit{color:var(--coral)} .result.good .tit{color:var(--green)}
  .result.mid{background:#fbf3dd;border:1px solid rgba(214,158,58,.5)}
  .result.mid .tit{color:#a06b12}
  .cmp-table{width:100%;border-collapse:collapse;font-size:13.5px;animation:fadein .6s;background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(0,0,0,.35)}
  .cmp-table th,.cmp-table td{padding:8px 9px;text-align:center;border-bottom:1px solid rgba(23,48,42,.09)}
  .cmp-table th{background:var(--deep);color:#ffe9bd;font-weight:600;font-size:13px}
  .cmp-table td:first-child{text-align:left;color:var(--muted);font-size:12.5px}
  .cmp-table tr:last-child td{color:var(--coral);font-weight:700}
  .cmp-table tr:last-child td:nth-child(3){color:var(--green)}
  .src{margin-top:auto;font-size:11.5px;line-height:1.7;color:var(--muted);border-top:1px dashed rgba(23,48,42,.2);padding-top:9px}

  /* ---------- 彩蛋弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(8,20,17,.6);animation:fadein .3s}
  .modal .card{width:min(420px,88vw);background:var(--paper);border-radius:20px;padding:26px 26px 20px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9);text-align:center;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .em{font-size:44px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .modal h3{font-family:var(--serif);font-size:20px;margin:10px 0 10px;letter-spacing:.06em;color:var(--deep)}
  .modal p{font-size:14.5px;line-height:1.9;text-align:left;color:#2c423b}
  .modal p b{color:var(--coral)}
  .modal button{margin-top:18px;font-family:inherit;font-size:14px;padding:10px 34px;border-radius:99px;
    border:none;cursor:pointer;background:var(--deep);color:#ffe9bd;letter-spacing:.08em}
  .newegg{position:fixed;top:64px;right:18px;z-index:59;background:var(--amber);color:#3a2500;
    font-size:13px;font-weight:700;padding:8px 16px;border-radius:99px;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);
    animation:pop .4s;letter-spacing:.05em}

  /* ---------- 开场 ---------- */
  #intro{position:fixed;inset:0;z-index:70;background:radial-gradient(120% 100% at 50% 0%,#123830,#0a1c18 70%);
    display:flex;align-items:center;justify-content:center;transition:opacity .8s}
  #intro.gone{opacity:0;pointer-events:none}
  .intro-card{text-align:center;color:#e9e2cf;max-width:560px;padding:24px}
  .intro-card .eyebrow{font-size:13px;letter-spacing:.4em;color:#9fbcb0;margin-bottom:16px}
  .intro-card h2{font-family:var(--serif);font-size:42px;letter-spacing:.1em;line-height:1.35;margin-bottom:18px}
  .intro-card h2 em{font-style:normal;color:var(--amber);text-shadow:0 0 30px rgba(255,176,58,.5)}
  .intro-card p{font-size:15px;line-height:2;color:#b9cec6;margin-bottom:30px}
  #startBtn{font-family:inherit;font-size:17px;letter-spacing:.2em;padding:15px 58px;border-radius:99px;
    border:1px solid rgba(255,176,58,.6);background:rgba(255,176,58,.12);color:#ffd98a;cursor:pointer;transition:all .3s}
  #startBtn:hover{background:var(--amber);color:#3a2500;box-shadow:0 0 40px rgba(255,176,58,.35)}

  @media (max-width:1000px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto}
    .stagewrap{height:52vh;min-height:300px}
    .panel{overflow:visible}
  }
</style>
</head>
<body>

<header>
  <h1>红树林蓝碳秘密 · <em>地下碳宝库</em></h1>
  <span id="eggCount">🎁 彩蛋 0 / 8</span>
</header>

<div class="app">
  <div class="stagewrap" id="stagewrap">
    <div id="stage"></div>
    <div id="fx"></div>
    <div id="callout" class="callout hide"></div>
  </div>
  <aside class="panel">
    <div class="tabs">
      <button class="tab on" data-ch="0">① 碳的旅程</button>
      <button class="tab" data-ch="1">② 对比实验</button>
      <button class="tab" data-ch="2">③ 命运的选择</button>
    </div>
    <div id="panelBody" style="display:flex;flex-direction:column;gap:12px;flex:1"></div>
    <div class="src">数据来源：明湾学校七年级近海生态研究项目（土壤碳占比 49–98%、储碳为普通森林 3–4 倍、破坏 1 公顷释放 500–1000 吨碳、全球已损失 35–50% 等均取自该研究资料，为科普量级估算）。</div>
  </aside>
</div>

<div id="intro">
  <div class="intro-card">
    <p class="eyebrow">一 粒 碳 的 地 下 旅 程</p>
    <h2>红树林把碳藏在哪儿？<br>不在枝头，在<em>脚下的泥</em>里</h2>
    <p>这里的泥，一公顷能攥住 500–1000 吨碳，是普通森林的 3–4 倍。<br>
       先看一粒碳怎么掉进泥里、一睡一百年；再跟森林比一场「谁锁得住碳」；<br>
       最后，这片林子的命运，由你签字决定。<br>
       对了——画面里闪光的圈圈一共有 8 个，每个都藏着秘密。</p>
    <button id="startBtn">推 门 进 去</button>
  </div>
</div>

<script>
/* ================= 工具 ================= */
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var SVGNS = 'http://www.w3.org/2000/svg';
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
function mk(tag, attrs, parent){
  var n = document.createElementNS(SVGNS, tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function spawnP(group, x, y, cls){
  var g = mk('g', {'class':'cpart' + (cls ? ' ' + cls : '')}, group);
  mk('circle', {cx:0, cy:0, r:13, 'class':'halo'}, g);
  mk('circle', {cx:0, cy:0, r:7, 'class':'core'}, g);
  g.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  return g;
}
function moveP(p, x, y, dur){
  p.style.transition = 'transform ' + (dur||1500) + 'ms cubic-bezier(.35,.65,.3,1), opacity ' + (dur||1500) + 'ms ease, fill .9s';
  p.style.transform = 'translate(' + x + 'px,' + y + 'px)';
}
function rnd(a, b){ return a + Math.random() * (b - a); }

/* ================= 彩蛋 ================= */
var EGGS = {
  soil:    {t:'泥土层的地基', e:'🟤', x:'红树林土壤的碳，可以占到整个生态系统碳储量的 <b>49%–98%</b>！这些碳可能已经在地下沉睡了数百年，甚至上千年。'},
  hypoxia: {t:'缺氧保险箱',   e:'🚫', x:'潮间带的泥土经常被海水浸泡，<b>缺氧</b>环境让微生物分解变慢，碳就能长期保存——就像被锁进一个密封的保险箱！'},
  roots:   {t:'根也储碳',     e:'🌱', x:'红树的根系本身也储存碳，死亡后会直接变成土壤有机碳。根系还能稳固泥土，防止碳流失。'},
  breath:  {t:'会呼吸的根',   e:'💨', x:'这些伸出水面的小尖芽叫<b>呼吸根</b>，它们让红树能在被海水淹没的环境里正常"呼吸"。'},
  tide:    {t:'时间胶囊',     e:'🌊', x:'潮水每天带来新的泥沙，一层一层覆盖落叶和死根，把碳"埋"进沉积层——就像一个慢慢封口的时间胶囊。'},
  microbe: {t:'睡着的小工人', e:'🦠', x:'缺氧环境让微生物的分解速度减慢 <b>10–100 倍</b>，它们几乎在"冬眠"——碳就跑不掉了。'},
  anchor:  {t:'天然防波堤',   e:'🛡️', x:'红树的根系不仅封存碳，还像<b>天然防波堤</b>一样抓住泥土、减弱海浪，防止海岸被冲刷——碳库也因此更安全。'},
  coast:   {t:'海岸守护者',   e:'🏠', x:'台风来袭时，红树林能明显减弱风浪，保护海岸边的村庄和农田。<b>保护红树林 = 保护海岸 + 保护碳库。</b>'}
};
var eggsFound = {};
function foundCount(){ return Object.keys(eggsFound).length; }
function updateEggCount(){ $('#eggCount').textContent = '🎁 彩蛋 ' + foundCount() + ' / 8'; }
function openEgg(id){
  var g = EGGS[id]; if(!g) return;
  var isNew = !eggsFound[id];
  eggsFound[id] = true; updateEggCount();
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><div class="em">' + g.e + '</div>' +
    '<h3>' + g.t + '</h3><p>' + g.x + '</p><button>知 道 了</button></div>';
  document.body.appendChild(m);
  m.querySelector('button').addEventListener('click', function(){ m.remove(); });
  m.addEventListener('click', function(ev){ if(ev.target === m) m.remove(); });
  if(isNew){
    var tip = document.createElement('div'); tip.className = 'newegg';
    tip.textContent = '🎉 收集新彩蛋 ' + foundCount() + '/8';
    document.body.appendChild(tip);
    setTimeout(function(){ tip.remove(); }, 2200);
  }
}
document.addEventListener('click', function(ev){
  var h = ev.target.closest ? ev.target.closest('.hotspot') : null;
  if(h) openEgg(h.dataset.egg);
});

/* ================= 场景绘制 ================= */
function treeSVG(){
  return '<g class="trunkG">' +
    '<path d="M -7 0 C -10 -60 -5 -120 0 -150" stroke="#5a4632" stroke-width="11" fill="none" stroke-linecap="round"/>' +
    '<path d="M 0 -148 C 7 -158 11 -166 13 -175" stroke="#5a4632" stroke-width="7" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="-30" cy="-170" rx="42" ry="24" fill="#3e8a55"/>' +
    '<ellipse cx="26" cy="-182" rx="46" ry="27" fill="#46a063"/>' +
    '<ellipse cx="-2" cy="-208" rx="48" ry="28" fill="#57b573"/>' +
    '<path d="M -4 -6 C -18 2 -30 4 -40 6" stroke="#5a4632" stroke-width="6" fill="none" stroke-linecap="round"/>' +
    '<path d="M 0 -4 C 12 2 26 5 36 7" stroke="#5a4632" stroke-width="6" fill="none" stroke-linecap="round"/>' +
    '<path d="M -2 -5 C -6 3 -12 6 -20 9" stroke="#4c3a29" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '<g class="uroots">' +
      '<path d="M 0 4 C -16 30 -30 55 -42 82" stroke="#4a3a28" stroke-width="7" fill="none" stroke-linecap="round"/>' +
      '<path d="M 0 4 C 0 40 -2 70 -4 100" stroke="#4a3a28" stroke-width="7" fill="none" stroke-linecap="round"/>' +
      '<path d="M 0 4 C 14 28 26 50 36 74" stroke="#4a3a28" stroke-width="7" fill="none" stroke-linecap="round"/>' +
    '</g></g>';
}
var HOT_ICONS = {
  tide:    '<path d="M -9 -3 q 4.5 -5 9 0 q 4.5 5 9 0"/><path d="M -9 4 q 4.5 -5 9 0 q 4.5 5 9 0"/>',
  breath:  '<line x1="-7" y1="8" x2="-7" y2="-3"/><line x1="0" y1="8" x2="0" y2="-6"/><line x1="7" y1="8" x2="7" y2="-1"/>' +
           '<circle class="fill" cx="-7" cy="-6" r="1.7"/><circle class="fill" cx="0" cy="-9" r="1.7"/><circle class="fill" cx="7" cy="-4" r="1.7"/>',
  roots:   '<line x1="0" y1="9" x2="0" y2="1"/><path d="M 0 1 C -1 -5 -5 -8 -9 -9"/><path d="M 0 1 C 1 -5 5 -8 9 -9"/>',
  anchor:  '<circle cx="0" cy="-8" r="3.2"/><line x1="0" y1="-5" x2="0" y2="9"/><line x1="-6" y1="-2" x2="6" y2="-2"/>' +
           '<path d="M -9 3 C -9 9 -4 11 0 11 C 4 11 9 9 9 3"/>',
  soil:    '<circle class="fill" cx="-5" cy="-4" r="1.9"/><circle class="fill" cx="4" cy="-1" r="1.9"/>' +
           '<circle class="fill" cx="-3" cy="4" r="1.9"/><circle class="fill" cx="6" cy="-7" r="1.9"/><circle class="fill" cx="1" cy="8" r="1.9"/>',
  hypoxia: '<circle cx="0" cy="0" r="9"/><line x1="-6.4" y1="6.4" x2="6.4" y2="-6.4"/>',
  microbe: '<circle cx="0" cy="0" r="6.2"/><line x1="-5.5" y1="-5.5" x2="-9" y2="-9"/><line x1="5.5" y1="-5.5" x2="9" y2="-9"/>' +

function callout(html, hide){

  calloutEl.innerHTML = html;
  calloutEl.classList.remove('hide');
}

var jStep = 0, jParts = [];
function panelJourney(){
  panelBody.innerHTML =
    '<p class="narr" id="narr">天上飘着的每一粒亮点，都是一口 CO₂。点一个年份，看这片林子怎么把碳<b>一层一层「埋」进泥里</b>。</p>' +
    '<div class="steps">' +
      '<button data-t="0" class="on">第 0 年</button><button data-t="1">1 年</button>' +

    '</div>' +
    '<button class="btn-primary" id="jPlay">▶ 自动播放整段旅程</button>';
  $$('#panelBody .steps button').forEach(function(b){
    b.addEventListener('click', function(){ if(!jBusy) jGo(parseInt(b.dataset.t, 10)); });
  });
  $('#jPlay').addEventListener('click', async function(){
    if(jBusy) return;
    jBusy = true; this.disabled = true; this.textContent = '⏳ 旅程播放中…';

    for(var i = 0; i < seq.length; i++){ await jGo(seq[i]); await wait(500); }
    jBusy = false;
  });
}
function markStep(t){
  $$('#panelBody .steps button').forEach(function(b){
    var v = parseInt(b.dataset.t, 10);
    b.classList.toggle('on', v === t);
    b.classList.toggle('done', v < t);
  });
}
function fadeTo(el, op, ms){
  el.style.transition = 'opacity ' + (ms || 1200) + 'ms';
  setTimeout(function(){ el.style.opacity = op; }, 30);
}
async function jGo(t){
  if(t <= jStep) return;
  var skyG = $('#j-sky'), tmp = $('#j-tmp'), bank = $('#j-bank');
  var canopy = [[210,268],[318,262],[408,272],[240,292],[300,294],[388,294],[228,248],[352,240],[300,268],[266,278],[334,278],[386,258]];

  if(t === 1){
    markStep(1); jStep = 1;
    narr('第 1 年 · 树叶把空气里的碳「摘」了下来，揉进自己的身体——这就是<b>光合作用</b>。');
    callout('🌳 看见了吗？碳粒子顺着叶脉，流进了树干。');
    jParts.forEach(function(p, i){
      setTimeout(function(){ moveP(p, canopy[i][0], canopy[i][1], 1600); }, i * 160);
    });
    await wait(3200);
    callout('碳到手了。别急——<b>真正的宝库还在脚底下</b>，故事才刚开头。');
    return;
  }
  if(t === 10){
    markStep(10); jStep = 10;
    narr('第 10 年 · 叶子黄了，「扑通」落进水里。碳搭着落叶这班船沉到泥面——潮水捎来的泥沙哗啦一层，<b>把它盖了个严实</b>。');
    callout('🍂 像盖被子：一层落叶，盖一层泥。');
    jParts.forEach(function(p, i){
      setTimeout(function(){
        p.classList.remove('co2');
        moveP(p, rnd(200, 440), rnd(470, 492), 1800);
      }, i * 140);
    });
    fadeTo($('#j-sed1'), 1, 1400);
    await wait(3400);
    callout('✅ 第一层封好了。接下来，该「缺氧」出场了。');
    return;
  }
  if(t === 50){
    markStep(50); jStep = 50;
    narr('第 50 年 · 碳越埋越深。氧气挤不进来，靠吃落叶为生的微生物饿得睡着了——碳在黑暗里，睡得踏实。');
    callout('🚫 一台天然的保险箱：没有氧气，微生物冬眠，分解慢了 <b>10–100 倍</b>。');
    jParts.forEach(function(p, i){
      setTimeout(function(){ moveP(p, rnd(180, 460), rnd(524, 566), 2000); }, i * 120);
    });
    fadeTo($('#j-sed2'), 1, 1600);
    await wait(3600);
    callout('🔎 画面里那两个发光的圈（🚫 和 🦠）藏着保险箱的秘密——去戳戳看。');
    return;
  }
  if(t === 100){
    markStep(100); jStep = 100;

    fadeTo($('#j-sed3'), 1, 1600);
    await wait(800);
    jParts.forEach(function(p, i){ setTimeout(function(){ moveP(p, rnd(160, 480), rnd(590, 700), 2200); }, i * 90); });

      (function(k){

          var q = spawnP(bank, rnd(500, 1000), rnd(588, 702));

          setTimeout(function(){ q.style.opacity = 1; }, 60);
        }, k * 90);
      })(i);
    }
    fx.className = ''; fx.classList.add('glow');
    await wait(3600);
    narr('同样是碳，森林为什么存不住？去 <b>② 对比实验</b>比一场，答案就出来了。');

var EMO_RE = /\p{RI}\p{RI}|\p{Emoji}(?:\uFE0F|\u200D\p{Emoji})*/u;
function splitEmo(s){
  var m = s.match(EMO_RE);
  if(!m) return ['', s];
  return ['<span class="emo">' + m[0] + '</span>', s.slice(m[0].length).replace(/^\s+/, '')];
}
function choicesHTML(list){
  return '<div class="fate-choices">' + list.map(function(c, i){
    if(c.plan){
      return '<button class="fchoice ' + c.cls + ' plan" data-fid="' + i + '">' +
        '<span class="ptag">方案 ' + c.plan + '</span>' +
        '<span class="pbody">' + c.label + '<small>' + c.sub + '</small></span></button>';
    }
    var p = splitEmo(c.label);
    return '<button class="fchoice ' + c.cls + '" data-fid="' + i + '">' + p[0] +
      '<span>' + p[1] + '<small>' + c.sub + '</small></span></button>';
  }).join('') + '</div>';
}
function disableChoices(){
  $$('#panelBody .fchoice').forEach(function(b){ b.disabled = true; b.style.opacity = .5; });
}
function bindChoices(list){
  $$('#panelBody .fchoice').forEach(function(b){
    b.addEventListener('click', function(){ list[parseInt(b.dataset.fid, 10)].fn(); });
  });
}
function endingBox(cls, title, rows, tail){
  var te = splitEmo(title);
  var h = '<div class="result ' + cls + '"><p class="tit">' + te[0] + '<span>' + te[1] + '</span></p>';
  rows.forEach(function(r){ h += '<p>' + r + '</p>'; });
  h += '<p style="margin-top:9px">' + tail + '</p></div>';
  h += '<div style="margin-top:12px"><button class="btn-primary" id="fRetry">↺ 再选一次，故事会不一样</button></div>';
  $('#fateBox').innerHTML = h;
  $('#fRetry').addEventListener('click', function(){ fx.className = ''; buildFate(); });
}

function animRotate(el, deg, dur){
  return new Promise(function(res){
    var steps = 24, i = 0;
    var timer = setInterval(function(){
      i++;
      el.setAttribute('transform', 'rotate(' + (deg * i / steps) + ')');
      if(i >= steps){ clearInterval(timer); res(); }
    }, Math.max(16, dur / steps));
  });
}

/* ================= 章节切换 ================= */
var builders = [buildJourney, buildCompare, buildFate];
function showChapter(i){
  if(i === CH && stage.innerHTML) return;
  CH = i;
  $$('.tab').forEach(function(t, k){ t.classList.toggle('on', k === i); });
  builders[i]();
}
$$('.tab').forEach(function(t){
  t.addEventListener('click', function(){ showChapter(parseInt(t.dataset.ch, 10)); });
});
$('#startBtn').addEventListener('click', function(){
  $('#intro').classList.add('gone');
  setTimeout(function(){ $('#intro').remove(); }, 900);
});
